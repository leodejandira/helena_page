<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Helena Tasks - V2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>MS Helena Tasks Manager</h1>

    <div class="tabs">
        <div class="tab active">Tarefas & Filtros</div>
        <div class="tab">Nova Tarefa</div>
    </div>

    <!-- ABA 1: LISTAGEM E FILTROS -->
    <div class="tab-content active" id="tab-0">

        <!-- Filtro rápido de status -->
        <div class="status-filter" id="status-filter"></div>

        <div class="grid-form filter-panel">
            <div class="form-group">
                <label>Grupo</label>
                <select id="f-grupo"></select>
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="f-categoria"></select>
            </div>
            <div class="form-group">
                <label>Complexidade</label>
                <select id="f-complex"></select>
            </div>
            <div class="form-group">
                <label>Criticidade</label>
                <select id="f-crit"></select>
            </div>
            <div class="form-group">
                <label>Custo Máximo (R$)</label>
                <input type="number" id="f-custo-max" placeholder="Ex: 100">
            </div>
            <div class="form-group">
                <label>Deadline Limite</label>
                <input type="date" id="f-data-max">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Grupo</th>
                    <th>Status</th>
                    <th>Criticidade</th>
                    <th>Custo</th>
                    <th>Tempo Gasto (h)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <!-- ABA 2: CADASTRO -->
    <div class="tab-content" id="tab-1">
        <form id="task-form">
            <div class="grid-form">
                <div class="form-group" style="grid-column: span 2;">
                    <label>Nome do Item / Tarefa *</label>
                    <input type="text" id="t-nome" required>
                </div>
                <div class="form-group">
                    <label>Grupo *</label>
                    <select id="t-grupo" required></select>
                </div>
                <div class="form-group">
                    <label>Categoria *</label>
                    <select id="t-categoria" required></select>
                </div>
                <div class="form-group">
                    <label>Complexidade</label>
                    <select id="t-complex"></select>
                </div>
                <div class="form-group">
                    <label>Criticidade</label>
                    <select id="t-crit"></select>
                </div>
                <div class="form-group">
                    <label>Custo (R$)</label>
                    <input type="number" id="t-custo" step="0.01" value="0.0">
                </div>
                <div class="form-group">
                    <label>Tempo Estimado (h)</label>
                    <input type="number" id="t-tempo-ext" step="0.1" value="0.0">
                </div>
                <div class="form-group">
                    <label>Data Limite</label>
                    <input type="date" id="t-data">
                </div>
            </div>
            <button type="submit">Salvar Tarefa</button>
        </form>
    </div>

    <!-- MODAL DA TAREFA -->
    <div class="modal-overlay" id="timer-modal">
        <div class="modal">
            <h3 id="m-title">Nome da Tarefa</h3>
            <p>Status atual: <span id="m-status"></span></p>
            <p>Tempo já salvo no banco: <strong id="m-banco-tempo">0.00</strong>h</p>

            <!-- Seção com timer: só aparece para tarefas Preparada / Em andamento -->
            <div id="modal-timer-section">
                <div class="timer-display" id="m-timer">00:00:00</div>
                <div class="timer-controls">
                    <button type="button" class="btn-start" id="btn-start">Iniciar / Retomar</button>
                    <button type="button" class="btn-pause" id="btn-pause">Pausar</button>
                    <button type="button" class="btn-interrupt" id="btn-interrupt">Interromper Momentaneamente (Salva Tempo)</button>
                    <button type="button" class="btn-finish" id="btn-finish">Concluir Tarefa</button>
                    <button type="button" class="btn-cancel-modal" id="btn-cancel-modal">Cancelar Tarefa</button>
                </div>
            </div>

            <!-- Seção somente-leitura: para tarefas Concluída / Cancelado -->
            <div id="modal-readonly-section" style="display: none;"></div>

            <button type="button" class="btn-close" id="btn-close-modal">Fechar</button>
        </div>
    </div>

    <!-- Scripts: ordem importa (state -> api -> filters -> timer -> tasks -> modal -> app) -->
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
